# Machine-specific toolchain config.
#
# This host has no working MinGW (the rustup-bundled dlltool cannot create
# import libraries and there is no `as`), and the MSVC toolchain has no linker.
# So we build for the LLVM-based windows-gnullvm target with a thin rust-lld
# wrapper that selects the right CRT object (crt2.o for exes, dllcrt2.o for
# dlls), reusing the GNU target's MinGW import libraries; libunwind is shimmed
# to libgcc_eh.
#
# Regenerate the shim with:  scripts/setup-toolchain.sh
[build]
target = "x86_64-pc-windows-gnullvm"

[target.x86_64-pc-windows-gnullvm]
linker = "C:/Users/YJSYY/.gnullvm-shim/rust-lld.exe"
rustflags = [
  "-C", "link-arg=-LC:/Users/YJSYY/.rustup/toolchains/stable-x86_64-pc-windows-gnu/lib/rustlib/x86_64-pc-windows-gnu/lib/self-contained",
  "-C", "link-arg=-LC:/Users/YJSYY/.gnullvm-shim",
]
