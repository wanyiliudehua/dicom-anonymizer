[package]
name = "dicom-anonymizer"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
walkdir = "2"
rayon = "1.10"
thiserror = "1"
hmac = "0.12"
sha2 = "0.10"
chrono = "0.4"
dicom-core = "0.10"
dicom-object = "0.10"
dicom-pixeldata = "0.10"
dicom-encoding = "0.10"
dicom-dictionary-std = "0.10"
dicom-transfer-syntax-registry = { version = "0.10", features = ["native", "openjp2", "deflate"] }

[features]
default = []
charls = ["dicom-transfer-syntax-registry/charls", "dicom-pixeldata/charls"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
