[package]
name = "dicom-anonymizer"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Bulk DICOM de-identification CLI implementing DICOM PS3.15 Table E.1-1"
license = "MIT"
repository = "https://github.com/wanyiliudehua/dicom-anonymizer"
readme = "README.md"
keywords = ["dicom", "anonymization", "de-identification", "ps3.15", "medical-imaging"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
rayon = "1.10"
thiserror = "1"
hmac = "0.12"
sha2 = "0.10"
chrono = "0.4"
dicom-core = "0.10"
dicom-object = "0.10"
dicom-pixeldata = "0.10"
dicom-encoding = "0.10"
dicom-dictionary-std = "0.10"
dicom-transfer-syntax-registry = { version = "0.10", features = ["native", "openjp2", "deflate"] }

[features]
default = []
charls = ["dicom-transfer-syntax-registry/charls", "dicom-pixeldata/charls"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
