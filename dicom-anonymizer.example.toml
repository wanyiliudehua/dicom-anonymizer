# Example configuration. Values shown are the defaults unless noted.
[profile]
base = "ps3.15-basic"                # or "research"
strategy = "aggressive"              # conservative | aggressive

# PS3.15 options (E.1-1 option columns). Each removes one restriction:
retain_longitudinal_temporal = false # Modified Dates (shift dates)
retain_longitudinal_full_dates = false # Full Dates (keep dates verbatim)
retain_safe_private = false          # keep EVERY private attribute (no safe-private allow-list)
retain_uids = false                  # keep original UIDs
retain_device_identity = false       # keep device identity
retain_institution_identity = false  # keep institution identity
retain_patient_characteristics = false # keep sex/age/size/weight
clean_descriptors = false            # clean descriptor text
clean_structured_content = false     # clean SR content
clean_graphics = false               # clean graphics/annotation

[dates]
strategy = "shift"                   # shift | zero | remove
shift_salt = ""                      # empty => random per run (set for reproducibility)
range_days = 3650                    # 0..=36500; bounds 2 * range_days + 1

[uids]
strategy = "remap"                   # remap | zero
root = "2.25."
salt = ""                            # empty => random per run

[pixels]
mode = "mask"                        # mask | keep
fill = 0                             # 0 | 255 | "max"
on_missing_burnedin = "warn"         # warn | skip | mask_all

[output]
filename = "sop_instance_uid"        # sop_instance_uid | preserve
layout = "mirror"                   # mirror | series (one dir per remapped series UID)
non_dicom = "skip"                   # skip | error (copying is deliberately not offered)

[limits]
max_input_bytes = 2147483648         # refuse larger inputs (0 = no limit)
max_parallel_bytes = 1073741824      # cap jobs x largest input (0 = no cap)

